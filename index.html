<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174f33"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>アナウンス9</title></head><body><header><div class="app-title">⚾ アナウンス9</div><div class="app-sub">学童野球アナウンスサポート</div></header><main><div class="card"><h2>試合時間</h2><div class="timer" id="gameTimer">00:00</div><div class="grid"><button onclick="startGameTimer()">開始</button><button class="secondary" onclick="stopGameTimer()">停止</button><button class="secondary" onclick="resetGameTimer()">リセット</button><button class="orange" onclick="preset('lastInning')">時間切れ</button></div></div><div class="card"><h2>クーリング・給水</h2><div class="timer" id="breakTimer">00:00</div><div class="grid"><button class="orange" onclick="startBreak(180,'クーリングタイム')">☀️ 3分</button><button class="blue" onclick="startBreak(120,'給水タイム')">💧 2分</button><button class="secondary" onclick="pauseBreak()">一時停止</button><button onclick="restartGame()">試合再開</button></div></div><div class="card sticky-output"><h2>アナウンス文</h2><div id="out" class="output">ここにアナウンス文が表示されます。</div><div class="grid"><button class="secondary" onclick="copyText()">コピー</button><button class="secondary" onclick="speakText()">読み上げ</button></div></div><div class="card"><h2>次打者</h2><select id="batter"></select><button onclick="nextBatter()">次打者アナウンス</button><button class="secondary" onclick="advanceBatter()">次の打順へ</button></div><div class="card"><h2>守備位置</h2><table id="defTable"></table></div><div class="card"><h2>守備変更・シート変更</h2><label>変更する守備位置</label><select id="changePos"></select><label>その守備につく選手</label><select id="changePlayer"></select><button onclick="changeDefense()">守備変更アナウンス</button></div><div class="card"><h2>選手交代</h2><label>交代する選手</label><select id="outPlayer"></select><label>入る選手</label><select id="inPlayer"></select><label>守備位置</label><select id="inPos"></select><button onclick="playerChange()">選手交代アナウンス</button></div><div class="card"><h2>時間切れ・タイブレーク</h2><div class="grid"><button class="orange" onclick="preset('lastInning')">この回が最終回</button><button class="orange" onclick="preset('gameEndTime')">時間切れ終了</button><button class="blue" onclick="preset('tiebreak')">タイブレーク</button><button class="blue" onclick="preset('tiebreak12')">無死一・二塁</button></div></div><div class="card"><h2>訂正</h2><input id="wrongText" placeholder="間違えた内容"><input id="correctText" placeholder="正しい内容"><button class="red" onclick="correction()">訂正アナウンス</button></div><div class="card"><h2>定型</h2><div class="grid"><button class="secondary" onclick="preset('start')">試合開始</button><button class="secondary" onclick="preset('end')">試合終了</button><button class="secondary" onclick="preset('foul')">ファウル注意</button><button class="secondary" onclick="preset('heat')">熱中症注意</button></div></div><div class="card"><h2>履歴</h2><div id="history" class="small">まだ履歴はありません。</div></div></main><script src="app.js"></script></body></html>
