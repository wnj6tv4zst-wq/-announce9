<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174f33"><title>アナウンス9</title><style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f2f4f3;margin:0;color:#222;padding-bottom:30px}header{background:#174f33;color:#fff;text-align:center;padding:18px 12px 14px;position:sticky;top:0;z-index:30}.app-title{font-size:25px;font-weight:800}.app-sub{font-size:12px;opacity:.9;margin-top:4px}main{padding:12px;max-width:900px;margin:auto}.card{background:#fff;border-radius:18px;padding:14px;margin:12px 0;box-shadow:0 2px 10px rgba(0,0,0,.08)}h2{font-size:19px;margin:0 0 10px;color:#174f33}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}button,select,input{width:100%;font-size:16px;padding:12px;border-radius:13px;border:1px solid #ccc;margin-top:7px}button{border:none;background:#174f33;color:#fff;font-weight:800}.secondary{background:#e7efe9;color:#174f33}.orange{background:#c46a16}.blue{background:#2369a8}.red{background:#a33333}.timer{font-size:44px;text-align:center;font-weight:900;color:#174f33;margin:8px 0}.output{white-space:pre-wrap;background:#fff8d9;border:1px solid #e2c760;border-radius:12px;padding:14px;line-height:1.75;font-size:17px;min-height:105px}.sticky-output{position:sticky;top:76px;z-index:20}table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid #ddd;padding:8px 5px;text-align:left}th{background:#edf4ef}.small{font-size:13px;color:#666;line-height:1.6}.note{background:#eef7f1;border-left:4px solid #174f33;padding:10px;border-radius:10px;font-size:13px;line-height:1.6}.member-row,.order-row{display:grid;gap:7px;align-items:end;margin:6px 0}.member-row{grid-template-columns:72px 1fr auto}.order-row{grid-template-columns:46px 1fr 1fr}.member-row button{width:auto;padding:11px 14px}.badge{display:inline-block;background:#174f33;color:#fff;border-radius:999px;padding:3px 8px;font-size:12px}label{display:block;font-weight:700;margin-top:9px}
</style></head><body><header><div class="app-title">⚾ アナウンス9</div><div class="app-sub">2026年度 小松市学童野球放送マニュアル準拠</div></header><main>
<section class="card"><div class="note">メンバーを登録→スタメン9人の打順・守備を設定→「このオーダーで試合開始」で打者・守備画面へ自動反映します。登録内容はiPhone内に保存できます。</div></section>
<section class="card"><h2>① メンバー登録</h2><label>チーム名</label><input id="teamName" placeholder="チーム名"><div id="memberRows"></div><div class="grid"><button class="secondary" onclick="addMemberRow()">＋追加</button><button class="secondary" onclick="loadDefaultMembers()">登録済み13人</button></div><div class="grid"><button onclick="saveMembers()">保存</button><button class="secondary" onclick="loadSavedMembers()">保存済み読込</button></div></section>
<section class="card"><h2>② オーダー設定</h2><div id="orderRows"></div><div class="grid"><button onclick="applyOrder()">このオーダーで試合開始</button><button class="secondary" onclick="loadLastOrder()">前回オーダー</button></div></section>
<section class="card"><h2>現在のオーダー</h2><table id="orderTable"></table></section>
<section class="card sticky-output"><h2>アナウンス文</h2><div id="out" class="output">ここにアナウンス文が表示されます。</div><div class="grid"><button class="secondary" onclick="copyText()">コピー</button><button class="secondary" onclick="speakText()">読み上げ</button></div></section>
<section class="card"><h2>試合時間</h2><div class="timer" id="gameTimer">00:00</div><div class="grid"><button onclick="startGameTimer()">開始</button><button class="secondary" onclick="stopGameTimer()">停止</button><button class="secondary" onclick="resetGameTimer()">リセット</button><button class="orange" onclick="setOutput('試合開始は、〇時〇分です')">開始時刻告知</button></div></section>
<section class="card"><h2>クーリング・給水</h2><div class="timer" id="breakTimer">00:00</div><div class="grid"><button class="orange" onclick="startBreak(180,'cooling')">☀️ クーリング3分</button><button class="blue" onclick="startBreak(120,'water')">💧 選手給水2分</button><button class="secondary" onclick="pauseBreak()">一時停止</button><button onclick="restartGame()">試合再開</button></div><button class="secondary" onclick="setOutput('審判の方は給水を行います。')">審判の給水</button></section>
<section class="card"><h2>打者アナウンス</h2><label>回</label><input id="inning" type="number" min="1" value="1"><label>表・裏</label><select id="half"><option>表</option><option>裏</option></select><label>チーム名</label><input id="batTeam" placeholder="チーム名"><label>打者</label><select id="batter"></select><div class="grid"><button onclick="batterFirstLap()">1巡目</button><button class="secondary" onclick="batterLaterLap()">2巡目以降</button></div><button class="secondary" onclick="advanceBatter()">次の打順へ</button></section>
<section class="card"><h2>現在の守備位置</h2><table id="defTable"></table></section>
<section class="card"><h2>代打</h2><label>打順</label><input id="phOrder" type="number" min="1" max="9" value="1"><label>交代する選手</label><select id="phOut"></select><label>代打</label><select id="phIn"></select><div class="grid"><button onclick="pinchHit(false)">イニング途中</button><button class="secondary" onclick="pinchHit(true)">イニング先頭</button></div></section>
<section class="card"><h2>守備交代</h2><label>守備位置</label><select id="defPos"></select><label>交代する選手</label><select id="defOut"></select><label>入る選手</label><select id="defIn"></select><label>打順</label><input id="defOrder" type="number" min="1" max="9" value="1"><button onclick="defensiveSubstitution()">守備交代アナウンス・反映</button></section>
<section class="card"><h2>シート変更</h2><label>選手</label><select id="shiftPlayer"></select><label>新しい守備位置</label><select id="shiftPos"></select><label>打順</label><input id="shiftOrder" type="number" min="1" max="9" value="1"><button onclick="seatChange()">シート変更アナウンス・反映</button></section>
<section class="card"><h2>代走・臨時代走</h2><label>ランナー位置</label><select id="runnerBase"><option>ファーストランナー</option><option>セカンドランナー</option><option>サードランナー</option></select><label>交代する選手</label><select id="prOut"></select><label>代走</label><select id="prIn"></select><div class="grid"><button onclick="pinchRun(false)">代走</button><button class="secondary" onclick="pinchRun(true)">臨時代走</button></div></section>
<section class="card"><h2>タイブレーク</h2><button class="blue" onclick="setOutput('大会規定により　タイブレーク　を行います。\nタイブレーク　はノーアウト　1塁2塁よりおこないます。')">タイブレーク開始</button><label>セカンドランナー</label><select id="tbSecond"></select><label>ファーストランナー</label><select id="tbFirst"></select><button class="secondary" onclick="tiebreakRunners()">ランナー紹介</button></section>
<section class="card"><h2>訂正</h2><input id="wrongText" placeholder="間違えた内容"><input id="correctText" placeholder="正しい内容"><button class="red" onclick="correction()">訂正アナウンス</button></section>
</main><script>
const POS=['ピッチャー','キャッチャー','ファースト','セカンド','サード','ショート','レフト','センター','ライト'];
const DEFAULT=[['1','宮田たいせい'],['2','北濱いつき'],['3','上野きしん'],['4','久田ゆうと'],['5','山崎はると'],['6','川元きざし'],['7','天徳寺りき'],['8','田畑かいと'],['9','竹平かずき'],['10','久田ひろと'],['11','稲川あん'],['12','北濱なお'],['13','山崎ゆいと']].map(x=>({no:x[0],name:x[1]}));
let members=[],lineup=[],defense={},gameSeconds=0,gameInterval=null,breakRemain=0,breakInterval=null;const $=id=>document.getElementById(id),fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),setOutput=t=>$('out').textContent=t;
function addMemberRow(no='',name=''){const d=document.createElement('div');d.className='member-row';d.innerHTML=`<input class="m-no" placeholder="背番号" value="${no}"><input class="m-name" placeholder="選手名" value="${name}"><button class="red" onclick="this.parentElement.remove()">×</button>`;$('memberRows').appendChild(d)}
function loadDefaultMembers(){$('memberRows').innerHTML='';DEFAULT.forEach(p=>addMemberRow(p.no,p.name));collectMembers();rebuildOrderRows();refreshAllSelects()}
function collectMembers(){members=[...document.querySelectorAll('.member-row')].map(r=>({no:r.querySelector('.m-no').value.trim(),name:r.querySelector('.m-name').value.trim()})).filter(p=>p.no&&p.name)}
function saveMembers(){collectMembers();localStorage.setItem('a9m',JSON.stringify(members));localStorage.setItem('a9t',$('teamName').value.trim());rebuildOrderRows();refreshAllSelects();alert('保存しました')}
function loadSavedMembers(){const s=JSON.parse(localStorage.getItem('a9m')||'[]');$('teamName').value=localStorage.getItem('a9t')||'';$('memberRows').innerHTML='';(s.length?s:DEFAULT).forEach(p=>addMemberRow(p.no,p.name));collectMembers();rebuildOrderRows();refreshAllSelects()}
function memberOptions(sel=''){return members.map((p,i)=>`<option value="${i}" ${String(i)===String(sel)?'selected':''}>${p.no}番 ${p.name}</option>`).join('')}
function rebuildOrderRows(saved=null){collectMembers();$('orderRows').innerHTML='';for(let i=0;i<9;i++){const d=document.createElement('div');d.className='order-row';const si=saved?.[i]?.memberIndex??(i<members.length?i:''),sp=saved?.[i]?.pos??POS[i];d.innerHTML=`<div><span class="badge">${i+1}番</span></div><select class="order-member">${memberOptions(si)}</select><select class="order-pos">${POS.map(p=>`<option ${p===sp?'selected':''}>${p}</option>`).join('')}</select>`;$('orderRows').appendChild(d)}}
function applyOrder(){collectMembers();const rows=[...document.querySelectorAll('.order-row')],used=new Set();lineup=[];for(let i=0;i<9;i++){const idx=Number(rows[i].querySelector('.order-member').value);if(used.has(idx)){alert('同じ選手が2回選ばれています');return}used.add(idx);const p=members[idx],pos=rows[i].querySelector('.order-pos').value;lineup.push({order:String(i+1),no:p.no,name:p.name,pos,memberIndex:idx})}defense={};lineup.forEach(p=>defense[p.pos]={no:p.no,name:p.name});localStorage.setItem('a9o',JSON.stringify(lineup));localStorage.setItem('a9t',$('teamName').value.trim());$('batTeam').value=$('teamName').value.trim();refreshGameUI();setOutput('オーダーを登録しました。')}
function loadLastOrder(){const s=JSON.parse(localStorage.getItem('a9o')||'[]');if(!s.length){alert('前回オーダーがありません');return}rebuildOrderRows(s)}
function allPlayerOptions(){return members.map((p,i)=>`<option value="${i}">${p.no}番 ${p.name}</option>`).join('')}
function refreshAllSelects(){collectMembers();const o=allPlayerOptions();['phOut','phIn','defOut','defIn','shiftPlayer','prOut','prIn','tbSecond','tbFirst'].forEach(id=>$(id).innerHTML=o);['defPos','shiftPos'].forEach(id=>$(id).innerHTML=POS.map(p=>`<option>${p}</option>`).join(''))}
function refreshGameUI(){$('orderTable').innerHTML='<tr><th>打順</th><th>守備</th><th>選手</th></tr>'+lineup.map(p=>`<tr><td>${p.order}番</td><td>${p.pos}</td><td>${p.no}番 ${p.name}</td></tr>`).join('');$('batter').innerHTML=lineup.map((p,i)=>`<option value="${i}">${p.order}番 ${p.pos} ${p.name}</option>`).join('');renderDefense();refreshAllSelects()}
function getPlayer(id){return members[Number($(id).value)]}function currentPositionByName(n){return POS.find(p=>defense[p]?.name===n)||''}function renderDefense(){$('defTable').innerHTML='<tr><th>守備</th><th>選手</th></tr>'+POS.map(p=>`<tr><td>${p}</td><td>${defense[p]?defense[p].no+'番 '+defense[p].name:'－'}</td></tr>`).join('')}
function startGameTimer(){if(gameInterval)return;gameInterval=setInterval(()=>{gameSeconds++;$('gameTimer').textContent=fmt(gameSeconds)},1000)}function stopGameTimer(){clearInterval(gameInterval);gameInterval=null}function resetGameTimer(){stopGameTimer();gameSeconds=0;$('gameTimer').textContent='00:00'}
function startBreak(sec,type){clearInterval(breakInterval);breakRemain=sec;$('breakTimer').textContent=fmt(breakRemain);setOutput(type==='cooling'?'只今より、クーリングタイムに入ります。選手・審判の方は、給水を行ってください':'選手給水の為、試合を中断いたします。いましばらくお待ちください');breakInterval=setInterval(()=>{breakRemain--;$('breakTimer').textContent=fmt(Math.max(0,breakRemain));if(breakRemain<=0){clearInterval(breakInterval);breakInterval=null;setOutput('お待たせいたしました。試合を再開いたします。')}},1000)}function pauseBreak(){clearInterval(breakInterval);breakInterval=null}function restartGame(){setOutput('お待たせいたしました。試合を再開いたします。')}
function batterFirstLap(){if(!lineup.length)return alert('先にオーダー設定をしてください');const p=lineup[Number($('batter').value)],team=$('batTeam').value||$('teamName').value||'〇〇';setOutput(`${$('inning').value}回の${$('half').value}、${team}の攻撃は、\n${p.order}番、${p.pos}、${p.name}\n${p.pos}、${p.name}、背番号${p.no}`)}function batterLaterLap(){if(!lineup.length)return alert('先にオーダー設定をしてください');const p=lineup[Number($('batter').value)],team=$('batTeam').value||$('teamName').value||'〇〇';setOutput(`${$('inning').value}回の${$('half').value}、${team}の攻撃は、\n${p.order}番、${p.pos}、${p.name}`)}function advanceBatter(){const b=$('batter');b.value=(Number(b.value)+1)%lineup.length;batterLaterLap()}
function pinchHit(lead){const o=getPlayer('phOut'),n=getPlayer('phIn'),ord=$('phOrder').value,team=$('batTeam').value||$('teamName').value||'〇〇';setOutput(lead?`${$('inning').value}回の${$('half').value}、${team}の攻撃は、\n${ord}番、${o.name}に代わりまして\n${n.name}\nバッターは${n.name}、背番号${n.no}`:`${ord}番、${o.name}に代わりまして\n${n.name}\nバッターは${n.name}、背番号${n.no}`)}
function defensiveSubstitution(){const o=getPlayer('defOut'),n=getPlayer('defIn'),pos=$('defPos').value,ord=$('defOrder').value,team=$('teamName').value||'〇〇';defense[pos]={no:n.no,name:n.name};renderDefense();setOutput(`${team}、選手の交代をお知らせいたします。\n${pos}、${o.name}に代わりまして、\n${n.name}\n${ord}番、${pos}、${n.name}、背番号${n.no}`)}
function seatChange(){const p=getPlayer('shiftPlayer'),np=$('shiftPos').value,ord=$('shiftOrder').value,team=$('teamName').value||'〇〇',op=currentPositionByName(p.name);if(op&&op!==np){const occ=defense[np];defense[op]=occ;defense[np]={no:p.no,name:p.name}}else defense[np]={no:p.no,name:p.name};renderDefense();setOutput(`${team}、シートの変更をお知らせいたします。\n${op||'現在の守備位置'}の${p.name}が${np}\n${ord}番、${np}、${p.name}、以上に代わります。`)}
function pinchRun(temp){const o=getPlayer('prOut'),n=getPlayer('prIn'),b=$('runnerBase').value;setOutput(temp?`当該打者${o.name}の臨時代走${n.name}\n臨時代走${n.name}`:`${b}${o.name}に代わりまして\n${n.name}\n${b}は${n.name}、背番号${n.no}`)}
function tiebreakRunners(){const s=getPlayer('tbSecond'),f=getPlayer('tbFirst'),team=$('teamName').value||'〇〇';setOutput(`${team}\nセカンドランナー　${s.name}、背番号${s.no}\nファーストランナー　${f.name}、背番号${f.no}`)}function correction(){setOutput(`失礼いたしました。\n${$('wrongText').value||'〇〇'}ではなく、${$('correctText').value||'△△'}です。`)}async function copyText(){try{await navigator.clipboard.writeText($('out').textContent);alert('コピーしました！')}catch{}}function speakText(){const u=new SpeechSynthesisUtterance($('out').textContent);u.lang='ja-JP';speechSynthesis.cancel();speechSynthesis.speak(u)}
function boot(){const s=JSON.parse(localStorage.getItem('a9m')||'[]');$('teamName').value=localStorage.getItem('a9t')||'';$('memberRows').innerHTML='';(s.length?s:DEFAULT).forEach(p=>addMemberRow(p.no,p.name));collectMembers();const o=JSON.parse(localStorage.getItem('a9o')||'[]');rebuildOrderRows(o.length?o:null);if(o.length){lineup=o;defense={};lineup.forEach(p=>defense[p.pos]={no:p.no,name:p.name});refreshGameUI()}else{refreshAllSelects();renderDefense()}}boot();
</script></body></html>
